name: Build & Deploy Static SEO Portal

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python source
        run: python -m py_compile src/build.py src/catalogo.py

      - name: Generate Programmatic SEO Pages
        run: python src/build.py

      - name: Validate generated site
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          output = Path("public")
          required = ["index.html", "sitemap.xml", "robots.txt", "privacidad-cookies.html"]
          missing = [name for name in required if not (output / name).is_file()]
          if missing:
              print("Faltan archivos generados:", ", ".join(missing))
              sys.exit(1)

          html_pages = list(output.glob("*.html"))
          if not html_pages:
              print("No se han generado páginas HTML.")
              sys.exit(1)

          for page in html_pages:
              html = page.read_text(encoding="utf-8")
              for marker in ('<html lang="es">', '<title>', '<meta name="description"', '<link rel="canonical"'):
                  if marker not in html:
                      print(f"Falta {marker!r} en {page}")
                      sys.exit(1)

              head = html.split("</head>", 1)[0]
              if "googletagmanager.com/gtag/js" in head:
                  print(f"Analytics se carga en el head antes de gestionar el consentimiento: {page}")
                  sys.exit(1)
              for marker in ("autocalc_privacidad_v2", "Rechazar analítica", "Aceptar analítica", "Configurar cookies"):
                  if marker not in html:
                      print(f"Falta el control de privacidad {marker!r} en {page}")
                      sys.exit(1)

          sitemap = (output / "sitemap.xml").read_text(encoding="utf-8")
          robots = (output / "robots.txt").read_text(encoding="utf-8")
          if "<loc>" not in sitemap or "Sitemap:" not in robots:
              print("El sitemap o robots.txt no contiene las referencias esperadas.")
              sys.exit(1)

          ads_file = output / "ads.txt"
          if ads_file.is_file() and "pub-0000000000000000" in ads_file.read_text(encoding="utf-8"):
              print("ads.txt contiene un identificador publicitario ficticio.")
              sys.exit(1)

          print(f"Validación correcta: {len(html_pages)} páginas HTML.")
          PY

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
