name: Build & Deploy Static SEO Portal

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python source
        run: python -m py_compile src/build.py src/catalogo.py

      - name: Generate Programmatic SEO Pages
        run: python src/build.py

      - name: Validate section 6 parts comparator
        run: python scripts/test_part_comparator.py

      - name: Validate catalog data
        run: python scripts/test_catalogue.py

      - name: Validate vehicle database importer
        run: python scripts/test_vehicle_catalog_import.py

      - name: Validate EEA data importer
        run: python scripts/test_eea_importer.py

      - name: Validate compact EEA vehicle catalogue
        run: python scripts/test_importar_catalogo_eea.py
      
      - name: Validate EEA search index exporter
        run: python scripts/test_exportar_indice_eea.py

      - name: Validate calculator methods and ad-slot configuration
        run: python scripts/test_calculators.py

      - name: Validate generated JavaScript syntax
        run: python scripts/test_inline_js.py

      - name: Validate affiliate disclosures and tracking links
        run: python scripts/test_affiliate_monetization.py

      - name: Test domain migration in both modes
        run: python scripts/test_domain_switch.py

      - name: Validate IndexNow key and sitemap
        run: python scripts/test_indexnow.py

      - name: Validate generated site
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sys

          output = Path("public")
          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          custom_domain = config.get("custom_domain", "").strip().lower()
          use_custom_domain = config.get("use_custom_domain", False) is True
          expected_domain = f"https://{custom_domain}" if use_custom_domain else config.get("domain", "").rstrip("/")
          required = ["index.html", "sitemap.xml", "robots.txt", "privacidad-cookies.html"]
          missing = [name for name in required if not (output / name).is_file()]
          if missing:
              print("Faltan archivos generados:", ", ".join(missing))
              sys.exit(1)

          html_pages = list(output.glob("*.html"))
          if not html_pages:
              print("No se han generado páginas HTML.")
              sys.exit(1)

          for page in html_pages:
              html = page.read_text(encoding="utf-8")
              for marker in ('<html lang="es">', '<title>', '<meta name="description"', '<link rel="canonical"'):
                  if marker not in html:
                      print(f"Falta {marker!r} en {page}")
                      sys.exit(1)

              head = html.split("</head>", 1)[0]
              if "googletagmanager.com/gtag/js" in head:
                  print(f"Analytics se carga en el head antes de gestionar el consentimiento: {page}")
                  sys.exit(1)
              for marker in ("autocalc_privacidad_v2", "Rechazar analítica", "Aceptar analítica", "Configurar cookies"):
                  if marker not in html:
                      print(f"Falta el control de privacidad {marker!r} en {page}")
                      sys.exit(1)

          index_html = (output / "index.html").read_text(encoding="utf-8")
          sitemap = (output / "sitemap.xml").read_text(encoding="utf-8")
          robots = (output / "robots.txt").read_text(encoding="utf-8")
          if expected_domain not in index_html:
              print(f"La portada no usa el dominio activo esperado: {expected_domain}")
              sys.exit(1)
          if "<loc>" not in sitemap or expected_domain not in sitemap or f"Sitemap: {expected_domain}/sitemap.xml" not in robots:
              print("El sitemap o robots.txt no coincide con el dominio activo.")
              sys.exit(1)

          for marker in ("Tramo fiscal IVTM (sin cuota local)", "Consulta el distintivo por matrícula", "no una cuota municipal"):
              if marker not in index_html:
                  print(f"Falta aclaración fiscal o DGT: {marker}")
                  sys.exit(1)

          stale_claims = ("~143 €/año", "~25 €/año", "85 % de los rechazos", "supone resultado desfavorable", "APTO PARA ITV (medida equivalente legal)", "¡Vehículo listo para inspección!", "suele ofrecer el precio más bajo", "hasta un 70 % de ahorro", "Legal ITV ≤30 mm", "usarPrecioGasolinera")
          for claim in stale_claims:
              if any(claim in page.read_text(encoding="utf-8") for page in html_pages):
                  print(f"Se ha encontrado una afirmación obsoleta o demasiado categórica: {claim}")
                  sys.exit(1)

          cname_file = output / "CNAME"
          if use_custom_domain:
              if not cname_file.is_file() or cname_file.read_text(encoding="utf-8").strip() != custom_domain:
                  print("El modo de dominio propio está activado, pero CNAME falta o no coincide.")
                  sys.exit(1)
          elif cname_file.exists():
              print("Hay un CNAME residual mientras el modo GitHub Pages está activo.")
              sys.exit(1)

          ads_file = output / "ads.txt"
          if ads_file.is_file() and "pub-0000000000000000" in ads_file.read_text(encoding="utf-8"):
              print("ads.txt contiene un identificador publicitario ficticio.")
              sys.exit(1)

          if any("contacto@tudominio.es" in page.read_text(encoding="utf-8") for page in html_pages):
              print("Una página contiene un correo de contacto de ejemplo.")
              sys.exit(1)

          for marker in ("Usar diésel", "Usar gasolina", "No estimable con estos datos", "umbral orientativo de 30 mm"):
              if marker not in index_html:
                  print(f"Falta una mejora esperada en la portada: {marker}")
                  sys.exit(1)

          print(f"Validación correcta: {len(html_pages)} páginas HTML.")
          PY

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout source for IndexNow notification
        uses: actions/checkout@v4

      - name: Set up Python for IndexNow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate sitemap and IndexNow key for submission
        run: python src/build.py

      - name: Notify IndexNow about published sitemap URLs
        run: python scripts/submit_indexnow.py
        continue-on-error: true
